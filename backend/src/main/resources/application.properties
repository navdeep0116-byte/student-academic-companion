
spring.application.name=student-academic-companion-backend
server.port=8080

spring.mongodb.database=student_academic_companion
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}

app.env=${APP_ENV:development}
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:5000}